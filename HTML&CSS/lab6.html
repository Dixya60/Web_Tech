<!DOCTYPE html>
<html>
    <head>
        <title>Web Page</title>
        <style>
            body{
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                text-align: center;
            }
            .header{
                background-color: red;
                padding: 20px;
                color: white
            }
            .title{
                background-color: gainsboro;
                padding: 20px;
            }
            .container{
                display: flex;
            }
            .box{
                padding: 40px;
                height: 350px ;
                font-size: large;
            }
            .box1 {
                background-color: rgb(164, 164, 206);
                width: 20%;
            }
            .box2{
                background-color: rgba(237, 189, 100, 0.579);
                width: 30%;
            }
            .box3{
                background-color: rgb(174, 231, 196);
                width: 50%;
            }
            .footer{
                background-color: rgb(240, 240, 119);
                padding: 20px;
            }
        </style>
    </head>

    <body>
        <div class="header"><h2>Header</h2></div>
        <div class="title"><h1>Welcome to my web page !</h1></div>
        <div class="container">
            <div class="box box1">Box 1</div>
            <div class="box box2">Box 2</div>
            <div class="box box3">Box 3</div>
        </div>
        <div class="footer"><h2>Footer</h2></div>
    </body>
</html>
