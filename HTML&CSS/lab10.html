<!DOCTYPE html>
<html>
    <head>
        <title>Registration form</title>
        <style>
            div{
                margin: auto;
                width: 40%;
            }
            h2{
                text-align: center;
            }
            form{
                border: 2px solid black;
                background-color: whitesmoke;
                padding: 30px;
            }
           label{
            display: block;
            margin-top: 10px;
            margin-left: 5px;
            font-weight: bold;
           } 
           input{
            padding: 8px;
            margin-top: 5px;

           }
           #name, #pw, #email {
            width: 95%;
           }
           #radio{
            margin-left: 60px;
           }
           select{
            padding: 8px;
           }
           textarea {
            width: 50%;
            padding: 10px;
            resize: none;
            box-sizing: border-box;
           }
           .btn {
            margin-top: 15px;
            margin-bottom: 5px;
            color: rgb(245, 248, 245);
            padding: 10px;
            width: 100px;
            background-color: green;
            cursor: pointer;
            border: none;
           }
        </style>
    </head>

    <body>
        <div>
            <h2>Registration Form</h2> 
            <form action="#">
                <label>Full Name : </label>
                <input type="text" id="name">
                <label>Email : </label>
                <input type="email" id="email" required placeholder="john@gmail.com">
                <label>Password : </label>
                <input type="password" id="pw" required>
                <label>Gender : </label>
                <input type="radio" name="gender" id="radio">Male
                <input type="radio" name="gender" id="radio">Female
                <label>Course : </label>
                <select>
                    <option>CSIT</option>
                    <option>BCA</option>
                    <option>BIM</option>
                </select>
                <label>Address : </label>
                <textarea rows="3"></textarea>
                 <label>
                <input type="checkbox" class="cbox">I agree to terms & conditions.
                 </label>
                <br>
                <input type="submit" value="Register" class="btn">
            </form>
        </div>
    </body>
</html>
