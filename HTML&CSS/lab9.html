<!DOCTYPE html>
<html>
    <head>
        <title>Mark Sheet</title>
        <style>
            .marksheet{
                border: 2px solid black;
                width: 500px;
                margin: 50px auto;
                height: 520px;
            }
            h1{
                text-align: center;
            }
            p{
                margin-left: 10px;
            }
            table {
                width: 98%;
                border-collapse: collapse;
                margin-left: 5px;
                margin-top: 40px;
            }

            th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: lightgray;
        }
        </style>
    </head>

    <body>
        <div class="marksheet">
            <h1>Student Mark Sheet</h1>
            <p><strong>Name : </strong>XYZ</p>
            <p><strong>Faculty : </strong>B.Sc.CSIT</p>
            <p><strong>Semester : </strong>Fifth</p>
            <table>
                <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Marks</th>
                        <th>Grade</th>
                    </tr>
                </thead>
                <tr>
                    <td>Cryptography</td>                
                    <td>91</td>                
                    <td>A+</td>                
                </tr>
                <tr>
                    <td>DAA</td>                
                    <td>82</td>                
                    <td>A</td>                
                </tr>
                <tr>
                    <td>Simulation</td>                
                    <td>85</td>                
                    <td>A</td>                
                </tr>
                <tr>
                    <td>Web Technology</td>                
                    <td>88</td>                
                    <td>A</td>                
                </tr>
                <tr>
                    <td>SAD</td>                
                    <td>77</td>                
                    <td>B+</td>                
                </tr>
                <tr>
                    <td>Multimedia</td>                
                    <td>83</td>                
                    <td>A</td>                
                </tr>
                <tr>
                    <th>Total</th>                
                    <th>506</th>                
                    <th></th>                
                </tr>
            </table>
        </div>
    </body>
</html>
