<!DOCTYPE html>
<html>
    <head>
        <title>List box</title>
        <style>
            #listbox {
                width: 200px;
                height: 40px;
                padding: 5px;
                background-color: beige;
                font-size: 15px;
            }
            body{
                font-family:'Times New Roman', Times, serif;
                color: rgb(6, 61, 63);
            }
        </style>
    </head>

    <body>
        <h3>Choose Programming Language</h3>
        <select name="listbox" id="listbox">
            <option>C</option>
            <option>C++</option>
            <option>Java</option>
            <option>Python</option>
            <option>PHP</option>
            <option>JavaScript</option>
        </select>
    </body>
</html>
