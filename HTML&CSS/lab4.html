
<!DOCTYPE html>
<html>
<head>
    <title>All CSS Types</title>
    <!-- Internal CSS -->
    <style>
        body{
            background-color: lightblue;
        }
        h2{
            color: white;
            text-align: center;
        }
    </style>
    <!-- External CSS (will work only if stylees.css exists) -->
    <link rel="stylesheet" href="stylees.css">
</head>

<body>
    <!-- Inline CSS -->
    <h1 style="color: rgb(174, 173, 181); text-align: center;">
        This is Inline CSS
    </h1>
    <!-- Internal CSS applied -->
    <h2>This is Internal CSS</h2>
    <!-- External CSS applied -->
    <h3>This is External CSS</h3>
</body>
</html>
