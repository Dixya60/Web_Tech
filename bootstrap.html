<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <style>
    .navbar-nav .nav-link {
      padding: 8px 15px;
    }
    .navbar-nav .nav-link:hover {
      color: #92f6bf;
    }
    .nav-btn {
      margin-left: 10px;
    }
    body{
      background-color: beige;
    }
  </style>

</head>

<body>
  <nav class="navbar navbar-expand-lg  navbar-dark bg-dark px-4 py-2">

    <div class="container-fluid">

      <a class="navbar-brand" href="#">
        <img src="logo.png" alt="Logo" style="height:60px; width:70px;">
      </a>

      <!-- Toggle button for mobile -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="#">Products</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="#">About Us</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="#">Contact</a>
          </li>
        </ul>

        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-but">
            <a class="btn btn-outline-light me-2" href="#">SignUp</a>
          </li>
          <li class="nav-but">
            <a class="btn btn-outline-light" href="#">Login</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <h3 class="text-center text-dark fs-2">Welcome!!</h3>
    <p class="text-center text-muted fs-5">
      Explore our products and services designed to make your experience better and easier.
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-gGkGON4WZ0F9bJ25vPb4ouMe3K6dfpLU6R8vgE1zJZ4UeRZ8LjE+0k3VkpFq1U0x"
    crossorigin="anonymous"></script>
    
</body>

</html>
