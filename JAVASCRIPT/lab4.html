<!DOCTYPE html>
<html>
<head>
    <title>Sum of Even Numbers</title>
</head>

<body>
    <h2>Sum of Even Numbers from 1 to 25</h2>
    <button onclick="calculateSum()">Calculate</button>
    <h3 id="result"></h3>
    <script>
        function calculateSum() {
            let sum = 0;

            for (let i = 1; i <= 25; i++) {
                if (i % 2 == 0) {
                    sum = sum + i;
                }
            }

            document.getElementById("result").innerHTML =
                "Sum of even numbers from 1 to 25 is: " + sum;
        }
    </script>
</body>
</html>
