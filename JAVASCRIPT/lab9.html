<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Selection using jQuery</title>

    <!-- Include jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body { font-family: Arial; margin: 20px; }
        select { padding: 5px; width: 200px; }
        button { padding: 5px 10px; margin-top: 10px; }
        p { font-weight: bold; margin-top: 10px; }
    </style>
</head>

<body>

    <h2>Choose a Country:</h2>

    <select id="countries">
        <option value="">--Select--</option>
        <option value="1">Nepal</option>
        <option value="2">India</option>
        <option value="3">USA</option>
        <option value="4">Japan</option>
    </select>

    <br>

    <button id="showSelection">Show Selection</button>

    <p id="output"></p>

    <script>
        $(document).ready(function () {

            $("#showSelection").click(function () {

                // Get selected value
                let selectedValue = $("#countries").val();

                // Get selected text
                let selectedText = $("#countries option:selected").text();

                if (selectedValue === "") {
                    $("#output").text("Please select a country.");
                } else {
                    $("#output").text(
                        "Selected Value: " + selectedValue +
                        " | Selected Text: " + selectedText
                    );
                }
            });

        });
    </script>

</body>
</html>
